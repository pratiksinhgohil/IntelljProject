name: Go CI Pipeline

on:
  push:
    branches: [ newbr ]
  pull_request:
    branches: [ newbr ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Download dependencies
        run: go mod download

      - name: Build project
        run: go build ./...

      - name: Run tests
        run: go test ./... -v -coverprofile=coverage.out

      - name: Show coverage
        run: go tool cover -func=coverage.out
